version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claimsense
      POSTGRES_PASSWORD: claimsense_secret_pass
      POSTGRES_DB: claimsense360_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimsense -d claimsense360_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://claimsense:claimsense_secret_pass@db:5432/claimsense360_db
      SECRET_KEY: claimsense360_super_secret_key
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
